<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>花蓮美食口袋名單</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen pb-16">

  <!-- 頂部導覽列 -->
  <header class="bg-gradient-to-r from-amber-500 to-orange-500 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center backdrop-blur-sm">
          <i class="fa-solid fa-utensils text-lg"></i>
        </div>
        <h1 class="text-lg font-bold tracking-wide">花蓮美食口袋名單</h1>
      </div>
      <div class="text-xs bg-white/25 backdrop-blur-sm px-3 py-1 rounded-full flex items-center gap-1.5 font-medium">
        <span class="w-2 h-2 rounded-full bg-emerald-300 animate-pulse"></span>
        多人即時同步中
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 mt-5 space-y-5">

    <!-- 新增美食表單區塊 -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
      <h2 class="text-base font-bold text-slate-800 mb-3 flex items-center gap-2">
        <i class="fa-solid fa-circle-plus text-amber-500"></i> 新增想吃的花蓮美食
      </h2>
      <form id="food-form" class="space-y-3.5">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">店家名稱 *</label>
          <input type="text" id="store-name" required placeholder="例如：花蓮香扁食"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500 text-slate-800 bg-slate-50/50 text-sm">
        </div>
        
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">地址 (輸入知名店名會自動帶入地址)</label>
          <input type="text" id="store-address" placeholder="例如：花蓮縣花蓮市中山路355號"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500 text-slate-800 bg-slate-50/50 text-sm">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">分類</label>
            <select id="store-category"
              class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500 text-slate-800 bg-slate-50/50 text-sm">
              <option value="小吃/扁食">小吃 / 扁食</option>
              <option value="麵食/飯類">麵食 / 飯類</option>
              <option value="甜點/冰品">甜點 / 冰品</option>
              <option value="飲料/紅茶">飲料 / 紅茶</option>
              <option value="海鮮/餐廳">海鮮 / 餐廳</option>
              <option value="夜市/其他">夜市 / 其他</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">備註/推薦</label>
            <input type="text" id="store-note" placeholder="例如：鮮蝦扁食必點"
              class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500 text-slate-800 bg-slate-50/50 text-sm">
          </div>
        </div>

        <button type="submit"
          class="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-bold py-3 rounded-xl shadow-md shadow-amber-500/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-sm mt-1">
          <i class="fa-solid fa-plus"></i> 新增至口袋名單
        </button>
      </form>
    </section>

    <!-- 狀態列 -->
    <div class="flex items-center justify-between text-xs text-slate-500 px-1 font-medium">
      <span id="total-count">共 0 家美食</span>
      <span>💡 點擊店名直接開 Google 地圖，可按箭頭調順序</span>
    </div>

    <!-- 清單列表 -->
    <div id="food-list" class="space-y-3">
      <div class="text-center py-12 text-slate-400">
        <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
        <p class="text-sm">正在載入雲端美食清單...</p>
      </div>
    </div>

  </main>

  <script>
    // ===== 你的 Firebase 設定 =====
    const firebaseConfig = {
      apiKey: "AIzaSyChEE-HjvuovlJhcv8iN9-D2C_iMqY3Dmo",
      authDomain: "hualien-food.firebaseapp.com",
      projectId: "hualien-food",
      storageBucket: "hualien-food.firebasestorage.app",
      messagingSenderId: "159326771942",
      appId: "1:159326771942:web:c9f6113249847b9476b927"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const collectionRef = db.collection('hualien_shared_foods');

    // 常見花蓮美食預設地址庫
    const presetAddresses = {
      '花蓮香扁食': '花蓮縣花蓮市中山路355號',
      '液香扁食': '花蓮縣花蓮市信義街42號',
      '戴記扁食': '花蓮縣花蓮市中華路120號',
      '炸蛋蔥油餅': '花蓮縣花蓮市復興街102號',
      '廟口紅茶': '花蓮縣花蓮市成功街218號',
      '耕壽司': '花蓮縣花蓮市節約街16-1號',
      '公正包子': '花蓮縣吉安鄉仁里拾三街46號',
      '周家蒸餃': '花蓮縣花蓮市公正街4-2號',
      '東大門夜市': '花蓮縣花蓮市中山路50號',
      '蔡記豆花': '花蓮縣花蓮市民國路73號'
    };

    // 自動填寫地址
    document.getElementById('store-name').addEventListener('input', (e) => {
      const name = e.target.value.trim();
      const addrInput = document.getElementById('store-address');
      if (presetAddresses[name] && !addrInput.value) {
        addrInput.value = presetAddresses[name];
      }
    });

    let localFoodsList = [];

    // ===== 即時監聽資料庫 =====
    collectionRef.orderBy('orderIndex', 'asc').onSnapshot((snapshot) => {
      localFoodsList = [];
      snapshot.forEach((doc) => {
        localFoodsList.push({ id: doc.id, ...doc.data() });
      });

      if (localFoodsList.length === 0 && snapshot.empty) {
        seedInitialData();
        return;
      }

      renderList(localFoodsList);
    }, (error) => {
      console.error('Firebase 連線錯誤:', error);
      alert('連線雲端資料庫失敗，請確認 Firebase Firestore 是否已啟用！');
    });

    function seedInitialData() {
      collectionRef.add({
        name: '花蓮香扁食',
        address: '花蓮縣花蓮市中山路355號',
        category: '小吃/扁食',
        note: '鮮蝦扁食超讚！',
        visited: false,
        orderIndex: Date.now()
      });
    }

    // ===== 渲染畫面 =====
    function renderList(foods) {
      const container = document.getElementById('food-list');
      document.getElementById('total-count').textContent = `共 ${foods.length} 家美食`;

      if (foods.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-10 text-center text-slate-400 shadow-sm border border-slate-200">
            <i class="fa-solid fa-utensils text-3xl mb-2 text-slate-300"></i>
            <p class="text-sm">目前還沒有任何美食，快在上方新增吧！</p>
          </div>`;
        return;
      }

      container.innerHTML = foods.map((item, index) => {
        const mapQuery = encodeURIComponent(`${item.name} ${item.address || '花蓮'}`);
        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${mapQuery}`;

        return `
          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 transition-all hover:shadow-md ${item.visited ? 'bg-slate-50/70' : ''}">
            <div class="flex items-start justify-between gap-3">
              
              <!-- 資訊區 -->
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 flex-wrap mb-1">
                  <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" 
                     class="text-base font-bold text-slate-800 hover:text-amber-600 hover:underline flex items-center gap-1.5 truncate ${item.visited ? 'line-through text-slate-400' : ''}">
                    ${escapeHtml(item.name)}
                    <i class="fa-solid fa-arrow-up-right-from-square text-[11px] text-amber-500"></i>
                  </a>

                  <span class="text-[10px] px-2 py-0.5 rounded-md bg-amber-50 text-amber-600 font-semibold">
                    ${escapeHtml(item.category || '未分類')}
                  </span>
                </div>

                <p class="text-xs text-slate-500 flex items-center gap-1.5 mb-1.5">
                  <i class="fa-solid fa-location-dot text-rose-500 shrink-0"></i>
                  <span class="truncate">${escapeHtml(item.address || '花蓮縣')}</span>
                </p>

                ${item.note ? `
                  <p class="text-xs text-slate-600 bg-slate-100/80 px-2.5 py-1 rounded-lg inline-block">
                    💬 ${escapeHtml(item.note)}
                  </p>
                ` : ''}
              </div>

              <!-- 右側按鈕：排序與管理 -->
              <div class="flex flex-col items-end gap-2 shrink-0">
                
                <!-- 上下排序 -->
                <div class="flex items-center bg-slate-100 rounded-lg p-0.5">
                  <button onclick="moveItem(${index}, -1)" ${index === 0 ? 'disabled class="text-slate-300 cursor-not-allowed px-1.5 py-0.5"' : 'class="text-slate-600 hover:text-amber-600 px-1.5 py-0.5"'} title="往上移">
                    <i class="fa-solid fa-chevron-up text-xs"></i>
                  </button>
                  <button onclick="moveItem(${index}, 1)" ${index === foods.length - 1 ? 'disabled class="text-slate-300 cursor-not-allowed px-1.5 py-0.5"' : 'class="text-slate-600 hover:text-amber-600 px-1.5 py-0.5"'} title="往下移">
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                  </button>
                </div>

                <!-- 狀態 / 編輯 / 刪除 -->
                <div class="flex items-center gap-1.5">
                  <button onclick="toggleVisited('${item.id}', ${!item.visited})" 
                    class="text-[11px] px-2 py-1 rounded-lg font-medium transition-colors ${item.visited ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                    ${item.visited ? '✓ 已吃過' : '想吃'}
                  </button>
                  <button onclick="editItem('${item.id}')" class="text-slate-400 hover:text-amber-500 text-xs p-1.5" title="編輯">
                    <i class="fa-solid fa-pen"></i>
                  </button>
                  <button onclick="deleteItem('${item.id}')" class="text-slate-400 hover:text-rose-500 text-xs p-1.5" title="刪除">
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                </div>

              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // ===== 新增 =====
    document.getElementById('food-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('store-name').value.trim();
      let address = document.getElementById('store-address').value.trim();
      const category = document.getElementById('store-category').value;
      const note = document.getElementById('store-note').value.trim();

      if (!name) return;
      if (!address) {
        address = presetAddresses[name] || `花蓮縣花蓮市${name}`;
      }

      await collectionRef.add({
        name,
        address,
        category,
        note,
        visited: false,
        orderIndex: Date.now()
      });

      document.getElementById('food-form').reset();
    });

    // ===== 調整順序 =====
    async function moveItem(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= localFoodsList.length) return;

      const currentItem = localFoodsList[index];
      const targetItem = localFoodsList[targetIndex];

      const tempOrder = currentItem.orderIndex || (index * 1000);
      const newTargetOrder = targetItem.orderIndex || (targetIndex * 1000);

      const batch = db.batch();
      batch.update(collectionRef.doc(currentItem.id), { orderIndex: newTargetOrder });
      batch.update(collectionRef.doc(targetItem.id), { orderIndex: tempOrder });
      await batch.commit();
    }

    // ===== 切換狀態 =====
    async function toggleVisited(id, newStatus) {
      await collectionRef.doc(id).update({ visited: newStatus });
    }

    // ===== 編輯 =====
    async function editItem(id) {
      const item = localFoodsList.find(f => f.id === id);
      if (!item) return;

      const newName = prompt('修改店家名稱：', item.name);
      if (newName === null) return;

      const newAddress = prompt('修改店家地址：', item.address || '');
      if (newAddress === null) return;

      const newNote = prompt('修改備註/推薦：', item.note || '');
      if (newNote === null) return;

      await collectionRef.doc(id).update({
        name: newName.trim() || item.name,
        address: newAddress.trim(),
        note: newNote.trim()
      });
    }

    // ===== 刪除 =====
    async function deleteItem(id) {
      if (confirm('確定要刪除這家美食嗎？')) {
        await collectionRef.doc(id).delete();
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
