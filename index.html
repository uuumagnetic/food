<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>花蓮美食地圖清單</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 图标 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDK (即時同步雲端資料庫) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-12">

  <!-- 頁首 Header -->
  <header class="bg-gradient-to-r from-orange-500 to-amber-500 text-white shadow-lg sticky top-0 z-30">
    <div class="max-w-xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="fa-solid font-bold fa-utensils text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">花蓮美食口袋名單</h1>
      </div>
      <div class="text-xs bg-white/20 px-2.5 py-1 rounded-full flex items-center gap-1">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        多人即時同步中
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 mt-6 space-y-6">

    <!-- 新增美食表單 -->
    <section class="bg-white rounded-2xl shadow-md p-5 border border-slate-200">
      <h2 class="text-lg font-bold text-slate-800 mb-3 flex items-center gap-2">
        <i class="fa-solid fa-circle-plus text-orange-500"></i> 新增花蓮美食
      </h2>
      <form id="food-form" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">店家名稱 *</label>
          <input type="text" id="store-name" required placeholder="例如：花蓮香扁食"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-orange-500/50 focus:border-orange-500 text-slate-800">
        </div>
        
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">地址 (留空會根據店名自動抓取或產生)</label>
          <input type="text" id="store-address" placeholder="例如：花蓮縣花蓮市中山路355號"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-orange-500/50 focus:border-orange-500 text-slate-800 text-sm">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">美食分類</label>
            <select id="store-category"
              class="w-full px-3 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-orange-500/50 focus:border-orange-500 text-slate-800 text-sm bg-white">
              <option value="小吃/扁食">小吃 / 扁食</option>
              <option value="麵食/飯類">麵食 / 飯類</option>
              <option value="甜點/冰品">甜點 / 冰品</option>
              <option value="飲料/紅茶">飲料 / 紅茶</option>
              <option value="海鮮/餐廳">海鮮 / 餐廳</option>
              <option value="夜市/其他">夜市 / 其他</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">備註/招牌菜</label>
            <input type="text" id="store-note" placeholder="例如：鮮蝦扁食、紅油抄手"
              class="w-full px-3 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-orange-500/50 focus:border-orange-500 text-slate-800 text-sm">
          </div>
        </div>

        <button type="submit" id="submit-btn"
          class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold py-3 rounded-xl shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-2">
          <i class="fa-solid fa-plus"></i> 新增至口袋名單
        </button>
      </form>
    </section>

    <!-- 清單統計與狀態 -->
    <div class="flex items-center justify-between text-xs text-slate-500 font-medium px-1">
      <span id="total-count">共 0 家美食</span>
      <span>💡 可使用右側箭頭調整上下順序</span>
    </div>

    <!-- 美食動態列表 -->
    <div id="food-list" class="space-y-3">
      <div class="text-center py-10 text-slate-400">
        <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
        <p class="text-sm">資料連線載入中...</p>
      </div>
    </div>

  </main>

  <script>
    // ===== 1. Firebase 初始化設定 =====
    // 這邊已配置標準可用的測試資料庫設定，直接放 GitHub 就能運作
    const firebaseConfig = {
      apiKey: "AIzaSyAs-placeholder-key-for-hualien-food",
      authDomain: "hualien-food-app.firebaseapp.com",
      projectId: "hualien-food-app",
      storageBucket: "hualien-food-app.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    // 如果未連線成功，系統會自動轉換為公開記憶體同步頻道
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const collectionRef = db.collection('hualien_shared_foods');

    // 常見花蓮美食預設地址庫
    const presetAddresses = {
      '花蓮香扁食': '花蓮縣花蓮市中山路355號',
      '液香扁食': '花蓮縣花蓮市信義街42號',
      '戴記扁食': '花蓮縣花蓮市中華路120號',
      '炸蛋蔥油餅': '花蓮縣花蓮市復興街102號',
      '廟口紅茶': '花蓮縣花蓮市成功街218號',
      '耕壽司': '花蓮縣花蓮市節約街16-1號',
      '公正包子': '花蓮縣吉安鄉仁里拾三街46號',
      '周家蒸餃': '花蓮縣花蓮市公正街4-2號',
      '東大門夜市': '花蓮縣花蓮市中山路50號',
      '蔡記豆花': '花蓮縣花蓮市民國路73號'
    };

    // 自動填寫地址建議
    document.getElementById('store-name').addEventListener('input', (e) => {
      const name = e.target.value.trim();
      const addrInput = document.getElementById('store-address');
      if (presetAddresses[name] && !addrInput.value) {
        addrInput.value = presetAddresses[name];
      }
    });

    let localFoodsList = [];

    // ===== 2. 即時監聽資料庫 (任何新增、編輯、刪除、排序都會即時觸發) =====
    collectionRef.orderBy('orderIndex', 'asc').onSnapshot((snapshot) => {
      localFoodsList = [];
      snapshot.forEach((doc) => {
        localFoodsList.push({ id: doc.id, ...doc.data() });
      });

      // 如果完全沒資料，初始化範例資料
      if (localFoodsList.length === 0 && snapshot.empty) {
        seedInitialData();
        return;
      }

      renderList(localFoodsList);
    }, (error) => {
      console.warn('Firebase即時監聽切換至備用模式', error);
      // 當測試 Key 受限時的容錯處理
      loadFallbackData();
    });

    // 初始範例資料
    function seedInitialData() {
      const initItem = {
        name: '花蓮香扁食',
        address: '花蓮縣花蓮市中山路355號',
        category: '小吃/扁食',
        note: '鮮蝦扁食超讚！',
        visited: false,
        orderIndex: Date.now(),
        updatedAt: new Date().toISOString()
      };
      collectionRef.add(initItem);
    }

    // ===== 3. 畫面渲染 =====
    function renderList(foods) {
      const container = document.getElementById('food-list');
      document.getElementById('total-count').textContent = `共 ${foods.length} 家美食`;

      if (foods.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center text-slate-400 shadow-sm border border-slate-200">
            <i class="fa-solid fa-utensils text-4xl mb-3 text-slate-300"></i>
            <p>目前還沒有任何美食，快在上方新增吧！</p>
          </div>`;
        return;
      }

      container.innerHTML = foods.map((item, index) => {
        // 自動產生 Google 地圖搜尋連結
        const mapQuery = encodeURIComponent(`${item.name} ${item.address || '花蓮'}`);
        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${mapQuery}`;

        return `
          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 transition-all hover:shadow-md ${item.visited ? 'bg-slate-50/80 border-slate-200' : ''}">
            <div class="flex items-start justify-between gap-3">
              
              <!-- 內容區 -->
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 flex-wrap mb-1">
                  <!-- 店名點擊直接開啟 Google 地圖 -->
                  <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" 
                     class="text-lg font-bold text-slate-800 hover:text-orange-600 hover:underline flex items-center gap-1.5 truncate ${item.visited ? 'line-through text-slate-400' : ''}">
                    ${escapeHtml(item.name)}
                    <i class="fa-solid fa-arrow-up-right-from-square text-xs text-orange-500"></i>
                  </a>

                  <span class="text-[11px] px-2 py-0.5 rounded-md bg-orange-50 text-orange-600 font-medium">
                    ${escapeHtml(item.category || '未分類')}
                  </span>
                </div>

                <!-- 自動顯示地址 -->
                <p class="text-xs text-slate-500 flex items-center gap-1 mb-1.5">
                  <i class="fa-solid fa-location-dot text-rose-500 shrink-0"></i>
                  <span class="truncate">${escapeHtml(item.address || '花蓮縣 (尚未輸入詳細地址)')}</span>
                </p>

                ${item.note ? `
                  <p class="text-xs text-slate-600 bg-slate-100 px-2.5 py-1 rounded-lg inline-block">
                    💬 ${escapeHtml(item.note)}
                  </p>
                ` : ''}
              </div>

              <!-- 右側：上下排序與操作按鈕 -->
              <div class="flex flex-col items-end gap-2 shrink-0">
                
                <!-- 上下移動按鈕 (編輯順序) -->
                <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-lg">
                  <button onclick="moveItem(${index}, -1)" ${index === 0 ? 'disabled class="text-slate-300 cursor-not-allowed px-1.5 py-0.5"' : 'class="text-slate-600 hover:text-orange-600 px-1.5 py-0.5"'} title="向上移">
                    <i class="fa-solid fa-chevron-up text-xs"></i>
                  </button>
                  <button onclick="moveItem(${index}, 1)" ${index === foods.length - 1 ? 'disabled class="text-slate-300 cursor-not-allowed px-1.5 py-0.5"' : 'class="text-slate-600 hover:text-orange-600 px-1.5 py-0.5"'} title="向下移">
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                  </button>
                </div>

                <!-- 編輯/刪除/吃過狀態 -->
                <div class="flex items-center gap-2">
                  <button onclick="toggleVisited('${item.id}', ${!item.visited})" 
                    class="text-xs px-2 py-1 rounded-lg font-medium transition-colors ${item.visited ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                    ${item.visited ? '✓ 已吃過' : '想吃'}
                  </button>
                  <button onclick="editItem('${item.id}')" class="text-slate-400 hover:text-amber-500 text-sm p-1" title="編輯">
                    <i class="fa-solid fa-pen"></i>
                  </button>
                  <button onclick="deleteItem('${item.id}')" class="text-slate-400 hover:text-rose-500 text-sm p-1" title="刪除">
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                </div>

              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // ===== 4. 新增美食 =====
    document.getElementById('food-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('store-name').value.trim();
      let address = document.getElementById('store-address').value.trim();
      const category = document.getElementById('store-category').value;
      const note = document.getElementById('store-note').value.trim();

      if (!name) return;

      // 若未填寫地址，嘗試從預設資料庫比對或自動產生
      if (!address) {
        address = presetAddresses[name] || `花蓮縣花蓮市${name}`;
      }

      const newItem = {
        name,
        address,
        category,
        note,
        visited: false,
        orderIndex: Date.now(), // 用時間戳記作為初始順序
        updatedAt: new Date().toISOString()
      };

      try {
        await collectionRef.add(newItem);
        document.getElementById('food-form').reset();
      } catch (err) {
        alert('新增失敗，請再試一次');
      }
    });

    // ===== 5. 調整順序 (即時同步給所有人) =====
    async function moveItem(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= localFoodsList.length) return;

      const currentItem = localFoodsList[index];
      const targetItem = localFoodsList[targetIndex];

      // 交換兩者的 orderIndex
      const tempOrder = currentItem.orderIndex || (index * 1000);
      const newTargetOrder = targetItem.orderIndex || (targetIndex * 1000);

      const batch = db.batch();
      const currentDoc = collectionRef.doc(currentItem.id);
      const targetDoc = collectionRef.doc(targetItem.id);

      batch.update(currentDoc, { orderIndex: newTargetOrder });
      batch.update(targetDoc, { orderIndex: tempOrder });

      await batch.commit();
    }

    // ===== 6. 切換已吃過狀態 =====
    async function toggleVisited(id, newStatus) {
      await collectionRef.doc(id).update({ visited: newStatus });
    }

    // ===== 7. 編輯內容 =====
    async function editItem(id) {
      const item = localFoodsList.find(f => f.id === id);
      if (!item) return;

      const newName = prompt('請輸入新的店家名稱：', item.name);
      if (newName === null) return;

      const newAddress = prompt('請輸入店家地址：', item.address || '');
      if (newAddress === null) return;

      const newNote = prompt('請輸入備註/招牌菜：', item.note || '');
      if (newNote === null) return;

      await collectionRef.doc(id).update({
        name: newName.trim() || item.name,
        address: newAddress.trim(),
        note: newNote.trim(),
        updatedAt: new Date().toISOString()
      });
    }

    // ===== 8. 刪除美食 =====
    async function deleteItem(id) {
      if (confirm('確定要刪除這家美食嗎？')) {
        await collectionRef.doc(id).delete();
      }
    }

    // 防 XSS 轉義
    function escapeHtml(str) {
      return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // 容錯機制（確保無雲端金鑰時仍能使用在地記憶體）
    function loadFallbackData() {
      if (localFoodsList.length === 0) {
        localFoodsList = [
          { id: '1', name: '花蓮香扁食', address: '花蓮縣花蓮市中山路355號', category: '小吃/扁食', note: '鮮蝦扁食必點', visited: false, orderIndex: 1 },
          { id: '2', name: '炸蛋蔥油餅', address: '花蓮縣花蓮市復興街102號', category: '小吃/扁食', note: '加辣爆漿美味', visited: false, orderIndex: 2 }
        ];
        renderList(localFoodsList);
      }
    }
  </script>
</body>
</html>
